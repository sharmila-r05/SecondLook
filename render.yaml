# Render Blueprint: the web app and its Postgres database. Secrets are `sync: false`: Render asks for them once in the
# dashboard and they never enter git. The web service is always on and the database is a paid plan, so the demo
# stays up (and its data stays) through judging.
services:
  - type: web
    runtime: node
    name: secondlook
    region: oregon
    plan: 0.5c-512mb            # always on ($7/mo; free web services sleep)
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: PAYPAL_ENV
        value: sandbox
      - key: DATABASE_URL
        fromDatabase:
          name: secondlook-db
          property: connectionString
      - key: LLM_MODEL
        value: claude-sonnet-5-5
      - key: HOLD_TIMEOUT_MINUTES
        value: "10"
      - key: SESSION_LLM_CALLS_CAP
        value: "20"
      - key: DAILY_LLM_CALLS_CAP
        value: "200"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Margaret's saved PayPal (a Vault payment token), so visitors' bills need no PayPal login.
      - key: DEMO_PARENT_VAULT_ID
        sync: false
      # Close-the-week's PayPal steps run on the Render Workflows service `secondlook-close-week` (workflows/close-week.ts,
      # created with Render's API: `type: workflow` in this Blueprint failed to sync) when the API key is set; without
      # it they run inline. Its start command: node --experimental-transform-types --import ./workflows/register.mjs
      # workflows/close-week.ts
      - key: RENDER_WORKFLOW
        value: secondlook-close-week
      - key: RENDER_WORKFLOW_API_KEY
        sync: false

databases:
  - name: secondlook-db
    region: oregon
    plan: 0.1c-256mb            # $6/mo; free Postgres is deleted after 30 days
    diskSizeGB: 1
    postgresMajorVersion: "18"
    ipAllowList: []
